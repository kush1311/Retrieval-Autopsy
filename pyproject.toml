[project]
name = "retrieval-autopsy"
version = "0.1.0"
description = "A RAG pipeline built to be observed: instrumented, switchable, ablatable."
requires-python = ">=3.12"
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "Kushal Desai" }]
keywords = ["rag", "retrieval", "evaluation", "observability", "hybrid-search", "ablation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rank_bm25>=0.2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["anthropic>=0.34", "openai>=1.30"]
qdrant = ["qdrant-client>=1.9"]
# Real local embeddings: BAAI/bge-small-en-v1.5 through ONNX. No key, no GPU, ~130MB
# downloaded on first use. Not a core dependency because `provider=offline` runs on the
# concept-bag embedder and needs nothing — but it IS required by the default `groq`
# profile, and by any keyless run that wants true vector geometry in the 3D view.
embed = ["fastembed>=0.3"]
# quickjs parse-checks the inspector's inline JavaScript. There is no Node here, so
# without it a syntax error in a 700-line inline script ships silently and takes the
# whole page down. The test skips cleanly if it is absent.
dev = ["pytest>=8.0", "hypothesis>=6.100", "quickjs>=1.19"]
# Everything, for a one-line setup.
all = [
    "retrieval-autopsy[llm,qdrant,embed,dev]",
]

[project.scripts]
autopsy = "autopsy.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["autopsy", "autopsy.stages", "autopsy.providers", "autopsy.store", "corpus", "evals", "evals.suites", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
